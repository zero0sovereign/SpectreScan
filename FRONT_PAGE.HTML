<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Terminal Input</title>
    <link rel="stylesheet" href="style.css">

    <script src="main.js" defer></script>

</head>
<body>
    <div align="center">
        <label for="myInput">Enter Link:</label><br><br>
        <input type="text" id="myInput" placeholder="Paste here..." autocomplete="off" spellcheck="false">
        <button id="submitBtn" style="cursor: pointer; padding: 2px 8px;">➔</button>
    </div>

    <!-- scan output is printed here, line by line, as results arrive -->
    <div id="terminal" aria-live="polite"></div>
</body>
</html>
